{{inject "myProductName" product}}

<div id="product_swatch_options" class="product-swatch-options" aria-label="Product color options"></div>

<script>
    // Note the lack of quotes around the jsContext handlebars helper, it becomes a string automatically.
    // jsContext will be a JSON string representing injected product data.
    var jsContext = JSON.parse({{jsContext}});

    console.log("Step 1");
    
    // Parse the custom field value which contains an array of { sku, swatch }
    var customFieldValue = [];
    try {
        customFieldValue = JSON.parse(jsContext.myProductName.custom_fields[0].value || '[]');
    } catch (e) {
        console.error('Failed to parse custom field JSON', e);
        customFieldValue = [];
    }

    var container = document.getElementById('product_swatch_options');

    // Build swatch radio controls
    customFieldValue.forEach(function(item) {
        console.log("Item is ", item);

        var label = document.createElement('label');
        label.className = 'product-swatch-label';
        label.style.display = 'inline-flex';
        label.style.alignItems = 'center';
        label.style.cursor = 'pointer';
        label.style.marginRight = '8px';

        var input = document.createElement('input');
        input.type = 'radio';
        input.name = 'product-swatch';
        input.value = item.sku;
        input.className = 'product-swatch-input';
        input.style.display = 'none'; // hide native radio

        var swatch = document.createElement('span');
        swatch.className = 'product-swatch';
        swatch.style.width = '24px';
        swatch.style.height = '24px';
        swatch.style.borderRadius = '50%';
        swatch.style.display = 'inline-block';
        swatch.style.backgroundColor = item.swatch || '#ffffff';
        swatch.style.border = '1px solid #ddd';
        swatch.style.boxSizing = 'border-box';
        swatch.title = item.sku;

        var text = document.createElement('span');
        text.style.marginLeft = '6px';
        text.textContent = item.sku;

        label.appendChild(input);
        label.appendChild(swatch);
        label.appendChild(text);
        container.appendChild(label);

        // clicking on swatch selects the input and triggers the handler
        swatch.addEventListener('click', function() {
            input.checked = true;
            onSwatchSelected(item.sku);
        });
    });

    // Handler: lookup product by SKU using GraphQL and redirect to product page
    function onSwatchSelected(sku) {
        console.log('Selected SKU:', sku);

        // GraphQL query using site.search to find product by SKU
        var query = `
            query {
            site {
                product (sku: "${sku}" ) {
                entityId
                    path
                }
            }
            }
        `;

        var payload = { query: query};
        console.log('GraphQL request payload:', payload);

        fetch('/graphql', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer {{ settings.storefront_api.token }}'
            },
            body: JSON.stringify(payload)
        })
        .then(function(res) {
            console.log('GraphQL HTTP response status:', res.status, res.statusText);
            return res.json().then(function(json) {
                console.log('GraphQL response JSON:', json);
                return json;
            });
        })

        .then(function(json) {
        console.log('GraphQL response JSON:', json);

        // Safely check for the path in the response
        var productPath = json?.data?.site?.product?.path;

        if (productPath) {
            console.log('Redirecting to:', productPath);
            // Redirect to the product page
            window.location.href = productPath;
        } else {
            console.error('Product path not found in response:', json);
            alert('Product not found. Please try again.');
        }
    })

        .catch(function(err) {
            console.error('GraphQL product lookup failed', err);
            alert('Error connecting to store. Please try again.');
            return null;
        });
    }
</script>
